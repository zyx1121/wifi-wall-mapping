[project]
name = "wallmap"
version = "0.1.0"
description = "Wall positions from Wi-Fi CSI multipath: simulation PoC"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wallmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
