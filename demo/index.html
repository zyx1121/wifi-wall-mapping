<!doctype html>
<html lang="zh-TW" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="1 台 AP、4 支天線、30 dB。看 5 種算法怎麼從 CSI 找出反射路徑，再換成牆。" />
    <title>牆面搜尋</title>
    <script>
      try {
        if (localStorage.getItem("task-web-theme") === "light") {
          document.documentElement.classList.replace("dark", "light");
        }
      } catch {}
      document.documentElement.style.colorScheme = document.documentElement.classList.contains("light") ? "light" : "dark";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
